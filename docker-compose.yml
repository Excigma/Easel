services:
  easel_postgres:
    image: postgres:16-alpine
    restart: always
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
   healthcheck:
     test: pg_isready -U postgres
     interval: 60s
     timeout: 20s
     retries: 5

  easel_redis:
    image: redis:alpine
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: redis-cli ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5

  easel_discord:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - TZ=$TZ
        - NODE_ENV=$NODE_ENV
        - POSTGRESQL_URL=$POSTGRESQL_URL
    restart: on-failure:5
    env_file:
      - .env
    volumes:
      - ./config:/usr/app/config
    depends_on:
      - 'easel_postgres'
      - 'easel_redis'

volumes:
  pg_data:
